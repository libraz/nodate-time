# Local development compose stack for nodate-time.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TC_DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${TC_DB_NAME:-timetree_clone}
      MYSQL_USER: ${TC_DB_USER:-ttuser}
      MYSQL_PASSWORD: ${TC_DB_PASSWORD:-ttpw}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=256
    ports:
      - "${TC_DB_PORT:-33306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${TC_DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # S3-compatible gateway storing objects as plain files under /data. Reached
  # only by the API; loopback binding exists only for a host-run dev API.
  storage:
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${TC_S3_ACCESS_KEY:-minioadmin}
      ROOT_SECRET_KEY: ${TC_S3_SECRET_KEY:-minioadmin}
      VGW_HEALTH: /health
    ports:
      - "127.0.0.1:${TC_S3_PORT:-9000}:7070"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
  storage_data:
