<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-labelledby="t d">
  <title id="t">nodate-flow and nodate-time sharing one MySQL</title>
  <desc id="d">Two independently deployable products can be pointed at one MySQL whose schema has three layers. nodate-time uses the core and time layers; nodate-flow uses core, time and flow. The core layer is a published specification vendored by copy, with no code shared between the products.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 14px; }
      .h { font-size: 16px; font-weight: 600; }
      .m { fill: #59636e; font-size: 12px; }
      .s { fill: #59636e; font-size: 11px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #59636e; }
      .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
      .link { fill: none; stroke: #6e7781; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="599" rx="16" fill="#fafbfc" stroke="#d0d7de"/>

  <!-- products -->
  <rect class="box" x="40" y="250" width="220" height="130" rx="10"/>
  <text class="h" x="60" y="282">nodate-time</text>
  <text class="m" x="60" y="304">api and web</text>
  <text class="m" x="60" y="332">uses core + time</text>
  <text class="s" x="60" y="358">also runs alone on its own MySQL</text>

  <rect class="box" x="840" y="210" width="220" height="130" rx="10"/>
  <text class="h" x="860" y="242">nodate-flow</text>
  <text class="m" x="860" y="264">flow-api and auth-api</text>
  <text class="m" x="860" y="292">uses core + time + flow</text>
  <text class="s" x="860" y="318">also runs alone on its own MySQL</text>

  <!-- shared database -->
  <rect x="330" y="80" width="440" height="410" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="7 5"/>
  <text class="h" x="350" y="108">One MySQL 9.7</text>
  <text class="s" x="470" y="108">optional: both products pointed at the same database</text>

  <rect x="350" y="124" width="400" height="92" rx="8" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/>
  <text class="h" x="368" y="150">flow layer</text>
  <text class="m" x="368" y="172">tasks, projects, signals, lenses, AI and MCP tables</text>
  <text class="mono" x="368" y="196">source: nodate-flow  sql/flow</text>

  <rect x="350" y="226" width="400" height="92" rx="8" fill="#ffffff" stroke="#4ac26b" stroke-width="1.5"/>
  <text class="h" x="368" y="252">time layer</text>
  <text class="m" x="368" y="274">album photos, avatar uploads, invites, sign-in state</text>
  <text class="mono" x="368" y="298">source: nodate-time  sql/time, vendored into nodate-flow</text>

  <rect x="350" y="328" width="400" height="144" rx="8" fill="#ffffff" stroke="#6e7781" stroke-width="1.75"/>
  <text class="h" x="368" y="354">core layer: the shared contract</text>
  <text class="m" x="368" y="376">users, identities, sessions, workspaces, calendars,</text>
  <text class="m" x="368" y="394">calendar events, the events log, storage objects</text>
  <text class="mono" x="368" y="418">source: nodate-flow  sql/core</text>
  <text class="mono" x="368" y="436">vendored into nodate-time, hash-pinned in UPSTREAM.json</text>
  <text class="mono" x="368" y="454">DDL, triggers, PROTOCOL.md, conformance suite</text>

  <!-- brackets and links -->
  <path class="link" d="M324 226 H310 V472 H324"/>
  <path class="link" d="M260 315 H310" />
  <path class="link" d="M776 124 H790 V472 H776"/>
  <path class="link" d="M840 275 H790"/>

  <text class="m" x="550" y="540" text-anchor="middle">No shared module and no runtime call between the products.</text>
  <text class="m" x="550" y="560" text-anchor="middle">The core layer is a specification each side copies in.</text>
</svg>
