# What every server block serves, whether it speaks TLS itself or sits behind
# something that does. Included from inside a server block, so it holds
# directives and no server of its own.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

# The API, including the blob relay at /blobs. The prefix is stripped rather
# than passed on: the API serves /auth, /calendars and the rest at its own
# root, so it never sees the /api it is published under. Whatever prefix is
# used here has to appear in TC_API_PUBLIC_URL too -- that is what OAuth
# callbacks and blob URLs are built from.
location /api/ {
    # Resolved per request through Docker's internal DNS rather than once at
    # startup. A literal host in proxy_pass is looked up while nginx reads its
    # configuration, which fails outright if the API is not up yet and goes
    # stale if the API is later recreated on a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replaces whatever the client sent. The API adopts an id from this hop,
    # so a forwarded client value would become the id it logs under.
    proxy_set_header X-Request-Id $request_id;

    # Attachments are accepted up to 100MB and travel through here. nginx
    # defaults to 1MB, which would fail the upload at the proxy -- before the
    # API can answer with the limit it actually enforces.
    client_max_body_size 128m;

    # Streamed both ways rather than staged on disk. An upload reaches the API
    # as it arrives, and a download reaches the browser as the API produces it,
    # which is what keeps a 100MB attachment from being written to the proxy's
    # temporary files on its way past.
    proxy_request_buffering off;
    proxy_buffering off;

    # A large transfer over a slow connection outlives the default 60s.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Vite fingerprints everything it emits here, so a changed file arrives under a
# changed name and these can be cached indefinitely.
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html is what names the current build. Cached, a deploy would keep
# serving the previous bundle's filenames until the entry expired.
location = /index.html {
    add_header Cache-Control "no-store";
}

# The SPA is one document with client-side routing, so any path that is not a
# built file has to answer with index.html. Without the fallback, reloading on
# /calendars/... or opening a share link directly returns 404.
location / {
    try_files $uri $uri/ /index.html;
}
