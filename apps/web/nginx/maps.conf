# Definitions every server block shares. Lives at http level, so it is copied to
# conf.d/ beside the generated server file rather than included from it.

# One line per request: the path and nothing after it. A share token is a path
# segment, and a reset or OAuth token rides in the query, so the default log
# format would file working credentials in the output that is kept longest.
# The token segment is replaced, and the query string, the Referer and the
# User-Agent are not logged at all. $request_uri is the URL as received, which
# the /api rewrite does not touch.
log_format app '$remote_addr [$time_local] "$request_method $log_path" $status '
               '$body_bytes_sent ${request_time}s $request_id';

map $request_uri $log_path {
    ~^(/api)?/(share|embed|invites)/[^/?]+([^?]*) $1/$2/:token$3;
    ~^([^?]*) $1;
}

# Only /embed/ is made to be framed by other sites; every other page refuses it.
# Keyed on the URL as received, because an SPA route reaches index.html through
# an internal redirect that no longer carries the route.
map $request_uri $spa_frame_ancestors {
    ~^/embed/ "*";
    default "'none'";
}

map $request_uri $spa_frame_options {
    ~^/embed/ "";
    default "DENY";
}

# An empty value is not sent. HSTS belongs to the hop that holds the
# certificate, which is this server only when it speaks TLS itself.
map $scheme $spa_hsts {
    https "max-age=31536000";
    default "";
}
