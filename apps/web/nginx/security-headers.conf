# Sent with every file the SPA serves. add_header in a location replaces the
# ones inherited from its server, so each location that sets its own headers
# includes this too. It is not included under /api/: the API sets its own.
#
# $spa_script_src is generated at image build (10-csp.conf) and names the hash
# of the inline theme script in index.html. Styles allow 'unsafe-inline'
# because the UI sets style attributes; Google Fonts is the only third party.
# connect-src and img-src are 'self' because TC_API_PUBLIC_URL is served under
# this host at /api.
add_header Content-Security-Policy "default-src 'self'; script-src $spa_script_src; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors $spa_frame_ancestors" always;
add_header X-Frame-Options $spa_frame_options always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security $spa_hsts always;
