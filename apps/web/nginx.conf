# The SPA is one document with client-side routing, so any path that is not a
# built file has to answer with index.html. Without the fallback, reloading on
# /calendars/... or opening a share link directly returns 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Vite fingerprints everything it emits here, so a changed file arrives
    # under a changed name and these can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is what names the current build. Cached, a deploy would keep
    # serving the previous bundle's filenames until the entry expired.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
