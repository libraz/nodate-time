name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.0"
  BUN_VERSION: "1.3.14"

jobs:
  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: bun run test

      - name: Production build and bundle budget
        working-directory: apps/web
        run: bun run build

  api:
    name: API (build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      # sql/core is a copy of the shared schema contract. The full check
      # asserts three things: that the copy is unedited here, that it
      # still matches the commit it claims to come from, and that the
      # commit it claims is still what upstream says today. Only the last
      # one can catch a contract that moved while this copy stood still,
      # and it is the one that needs the network.
      - name: Vendored contract is intact and current
        run: bash scripts/check-vendored-core.sh

      # A schema change and the code generated from it are one change, but
      # nothing else in the pipeline can tell them apart: a field the
      # generator never emitted simply does not exist, so the build succeeds
      # and the tests pass while the column is unreachable.
      - name: Install sqlc
        # The version is read from the checker so the two cannot disagree;
        # different sqlc versions emit different code from the same input.
        run: |
          version=$(grep -m1 '^SQLC_VERSION=' scripts/check-codegen-drift.sh | cut -d'"' -f2)
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Schema and generated data layer agree
        run: make verify-codegen

      - name: Start MySQL
        run: |
          docker compose up -d mysql
          # Wait for the container to report healthy (schema is applied on first init).
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mysql)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"; break
            fi
            echo "Waiting for MySQL ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs mysql; exit 1
          fi

      - name: Start MinIO
        run: |
          docker compose up -d minio
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q minio)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "MinIO is healthy"; break
            fi
            echo "Waiting for MinIO ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs minio; exit 1
          fi

      - name: Build
        working-directory: apps/api
        run: go build ./...

      # The schema claims to implement a shared contract; this is what
      # checks that it does, rather than only that it loads.
      - name: Core contract conformance
        run: |
          bash sql/core/conformance/run.sh \
            --dsn "root:rootpw@127.0.0.1:${TC_DB_PORT:-33306}/${TC_DB_NAME:-timetree_clone}" \
            --mode all

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: E2E tests
        working-directory: apps/api
        env:
          TC_TEST_INTEGRATION: '1'
          TC_TEST_MINIO: '1'
        run: go test ./... -count=1

      # The pass above has object storage for every test in it -- the test
      # server is built once per process -- so the tests that assert what the
      # API answers without storage skip there, and a skip is not a failure.
      # This is the run that executes them. Invoked through make so the set it
      # selects is defined in one place and can be reproduced locally with the
      # same command.
      - name: E2E tests (object storage absent)
        run: make test-e2e-storage-absent
