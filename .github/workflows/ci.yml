name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  BUN_VERSION: "1.4.5"
  NODE_VERSION: "26.13.1"

jobs:
  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: bun run test

      - name: Production build and bundle budget
        working-directory: apps/web
        run: bun run build

  api:
    name: API (build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The upgrade-path check loads the schema of v0.1.0 and of an
          # earlier main from history.
          fetch-depth: 0

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      # verify-codegen regenerates the web API types from the OpenAPI document.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # sql/core is a copy of the shared schema contract. This asserts that
      # the copy is unedited here and still matches the commit it claims to
      # come from. Whether upstream has moved on is not asserted here, since
      # that would redden unrelated PRs; vendored-drift.yml reports it daily.
      - name: Vendored contract is unedited and matches its pin
        run: make check-core-pin

      # A product layer may add tables but never reshapes a core table.
      - name: No product layer alters a core table
        run: bash sql/core/tools/check-no-core-alters.sh sql

      # A schema change and the code generated from it are one change, but
      # nothing else in the pipeline can tell them apart: a field the
      # generator never emitted simply does not exist, so the build succeeds
      # and the tests pass while the column is unreachable.
      - name: Install sqlc
        # The version is read from the checker so the two cannot disagree;
        # different sqlc versions emit different code from the same input.
        run: |
          version=$(grep -m1 '^SQLC_VERSION=' scripts/check-codegen-drift.sh | cut -d'"' -f2)
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Schema and generated data layer agree
        run: make verify-codegen

      - name: Start MySQL
        run: |
          docker compose up -d mysql
          # Wait for the container to report healthy (schema is applied on first init).
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mysql)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"; break
            fi
            echo "Waiting for MySQL ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs mysql; exit 1
          fi

      - name: Start object storage
        run: |
          docker compose up -d storage
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q storage)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "Storage is healthy"; break
            fi
            echo "Waiting for storage ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs storage; exit 1
          fi

      - name: Build
        working-directory: apps/api
        run: go build ./...

      # The schema claims to implement a shared contract; this is what
      # checks that it does, rather than only that it loads.
      - name: Core contract conformance (schema)
        run: |
          bash sql/core/conformance/run.sh \
            --dsn "root:rootpw@127.0.0.1:${TC_DB_PORT:-33306}/${TC_DB_NAME:-nodate_time}" \
            --mode schema

      # Check the historical upgrades against their target schema.
      - name: Upgrade path
        run: make test-upgrade-path

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      # The vendored go-webdav fork is a separate module that apps/api's
      # ./... does not reach.
      - name: go-webdav fork tests
        run: make test-third-party

      - name: E2E tests
        working-directory: apps/api
        env:
          TC_TEST_INTEGRATION: "1"
          TC_TEST_STORAGE: "1"
        # -coverpkg: the e2e package drives the server in-process, so the
        # code under test lives in other packages.
        run: go test ./... -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out

      # The pass above has object storage for every test in it -- the test
      # server is built once per process -- so the tests that assert what the
      # API answers without storage skip there, and a skip is not a failure.
      # This is the run that executes them. Invoked through make so the set it
      # selects is defined in one place and can be reproduced locally with the
      # same command.
      - name: E2E tests (object storage absent)
        run: make test-e2e-storage-absent GOTESTFLAGS='-covermode=atomic -coverpkg=./... -coverprofile=coverage-absent.out'

      # The data rules hold over rows the API wrote, so they run once the e2e
      # passes have written them.
      - name: Core contract conformance (data)
        run: |
          bash sql/core/conformance/run.sh \
            --dsn "root:rootpw@127.0.0.1:${TC_DB_PORT:-33306}/${TC_DB_NAME:-nodate_time}" \
            --mode data

      # Public repo: codecov runs tokenless. Uploads never gate CI.
      - name: Upload coverage (api)
        uses: codecov/codecov-action@v7.1.1
        with:
          files: apps/api/coverage.out,apps/api/coverage-absent.out
          flags: api
          fail_ci_if_error: false
