name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Unit tests
        working-directory: apps/web
        run: bun run test

      - name: Production build and bundle budget
        working-directory: apps/web
        run: bun run build

  api:
    name: API (build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum

      # sql/core is a copy of the shared schema contract. This asserts
      # that the copy is unedited here; the other half of the check —
      # that it still matches the pinned upstream ref — is
      # scripts/check-vendored-core.sh without --local-only, and needs
      # that ref to be reachable from CI.
      - name: Vendored contract unedited
        run: bash scripts/check-vendored-core.sh --local-only

      - name: Build schema
        run: bash sql/build-schema.sh

      - name: Start MySQL
        run: |
          docker compose up -d mysql
          # Wait for the container to report healthy (schema is applied on first init).
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mysql)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"; break
            fi
            echo "Waiting for MySQL ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs mysql; exit 1
          fi

      - name: Start MinIO
        run: |
          docker compose up -d minio
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q minio)" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "MinIO is healthy"; break
            fi
            echo "Waiting for MinIO ($status)..."; sleep 3
          done
          if [ "$status" != "healthy" ]; then
            docker compose logs minio; exit 1
          fi

      - name: Build
        working-directory: apps/api
        run: go build ./...

      # The schema claims to implement a shared contract; this is what
      # checks that it does, rather than only that it loads.
      - name: Core contract conformance
        run: |
          bash sql/core/conformance/run.sh \
            --dsn "root:rootpw@127.0.0.1:${TC_DB_PORT:-33306}/${TC_DB_NAME:-timetree_clone}" \
            --mode all

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: E2E tests
        working-directory: apps/api
        env:
          TC_TEST_INTEGRATION: '1'
          TC_TEST_MINIO: '1'
        run: go test ./... -count=1
